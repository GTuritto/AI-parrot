services:
  ai-parrot-api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Copy your API keys from .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVEN_API_KEY=${ELEVEN_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - AI_PARROT_API_TOKEN=${AI_PARROT_API_TOKEN:-}
      # MCP Server Configuration
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:3002/mcp}
      - MCP_SSE_URL=${MCP_SSE_URL:-http://host.docker.internal:3002/sse}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-local-mcp-server}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount output directory to persist generated podcasts
      - ./PodcastOutput:/app/PodcastOutput
      # Mount configuration directory for RSS feeds
      - ./config:/app/config:ro
      # Mount memory directory for persistent storage
      - ./memory:/app/memory
      # Mount .env file if it exists
      - ./.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-parrot-network
  
  ai-parrot-ui:
    build: .
    command: streamlit run streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      # Copy your API keys from .env file
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - ELEVEN_API_KEY=${ELEVEN_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - AI_PARROT_API_TOKEN=${AI_PARROT_API_TOKEN:-}
      - AI_PARROT_API_URL=${AI_PARROT_API_URL:-http://ai-parrot-api:8000}
      # MCP Server Configuration
      - MCP_SERVER_URL=${MCP_SERVER_URL:-http://host.docker.internal:3002/mcp}
      - MCP_SSE_URL=${MCP_SSE_URL:-http://host.docker.internal:3002/sse}
      - MCP_SERVER_NAME=${MCP_SERVER_NAME:-local-mcp-server}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      # Mount output directory to persist generated podcasts
      - ./PodcastOutput:/app/PodcastOutput
      # Mount configuration directory for RSS feeds
      - ./config:/app/config:ro
      # Mount memory directory for persistent storage
      - ./memory:/app/memory
      # Mount .env file if it exists
      - ./.env:/app/.env:ro
    depends_on:
      - ai-parrot-api
    restart: unless-stopped
    networks:
      - ai-parrot-network

  # Optional: MCP Server (if you want to run it in the same compose)
  # mcp-server:
  #   image: your-mcp-server:latest
  #   ports:
  #     - "3002:3002"
  #   networks:
  #     - ai-parrot-network

networks:
  ai-parrot-network:
    driver: bridge

volumes:
  podcast-output:
    driver: local
